## FreeSWITCH build-time module list.
##
## Matches exactly the audited, live modules.conf.xml on the Raspberry Pi
## this deployment migrates from — see ../RASPBERRY_FREESWITCH_BACKUP.md's
## "Loaded modules" section. mod_audio_stream is deliberately NOT listed here:
## it isn't part of the stock FreeSWITCH source tree — it's built separately
## in the Dockerfile's mod-audio-stream-builder stage from
## github.com/aelboum/mod_audio_stream (v1.0.0-ai-pbx) and installed into the
## same mod/ directory afterwards.
##
## IMPORTANT: this file's own build system (src/mod/Makefile) treats a
## single leading '#' as "commented-out/disabled module", not a free-text
## comment — only '##' (double-hash) is ignored as a real comment. Using a
## single '#' for prose (as an earlier version of this file did) gets
## parsed as garbage "disabled module" entries and corrupts the generated
## Makefile ("multiple target patterns" at build time). Keep every
## non-module line prefixed with '##', never a bare '#'.

